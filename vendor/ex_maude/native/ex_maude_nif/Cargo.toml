[package]
name = "ex_maude_nif"
version = "0.1.0"
edition = "2021"
authors = ["Tobias Bohwalli <hi@futhr.io>"]
description = "Rustler NIF for ExMaude - manages Maude subprocess"
license = "MIT"
repository = "https://github.com/futhr/ex_maude"
rust-version = "1.91"

[lib]
name = "ex_maude_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
crossbeam-channel = "0.5"
os_pipe = "1.2"
