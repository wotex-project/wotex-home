name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          # Exercise each supported OTP generation, including the release environment.
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Setup Rust for NIF coverage
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.91.1"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run tests with coverage
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        env:
          EX_MAUDE_BUILD: "1"
        run: |
          mix compile --force --warnings-as-errors
          mix coveralls.json --include integration

      - name: Upload to Codecov
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/excoveralls.json
          fail_ci_if_error: false

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Benchmark regression tests
        run: mix test --include benchmark test/ex_maude/benchmark_regression_test.exs

      - name: Security audit
        run: |
          mix hex.audit
          mix deps.audit

      - name: Sobelow security scan
        run: mix sobelow --config

      - name: Check GitHub Actions workflows
        run: |
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${install_dir}"
          GOBIN="${install_dir}" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "${install_dir}/actionlint"

      - name: Check shell scripts
        run: shellcheck bin/*.sh

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Restore PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run Dialyzer
        run: mix dialyzer

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Generate docs
        run: mix docs --warnings-as-errors

      - name: Check doc coverage
        run: mix doctor

      - name: Validate Hex package
        run: |
          package_dir="${RUNNER_TEMP}/ex_maude-package"
          mix hex.build --unpack --output "${package_dir}"
          cd "${package_dir}"
          mix deps.get
          mix docs --warnings-as-errors

  nif:
    name: NIF Test (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-15 }
          - { os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        id: setup-beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.91.1"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            native/ex_maude_nif/target
          key: nif-${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock', 'native/ex_maude_nif/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Install Maude (Linux only)
        if: matrix.job.os == 'ubuntu-22.04'
        run: |
          # macOS uses the bundled darwin binary in priv/maude/bin/.
          # Linux runners need the linux binary either bundled or installed.
          test -x priv/maude/bin/maude-linux-x64 || mix maude.install

      - name: Compile (force NIF build from source)
        env:
          EX_MAUDE_BUILD: "1"
        run: mix compile --warnings-as-errors

      - name: Run NIF + integration tests
        env:
          EX_MAUDE_BUILD: "1"
        run: mix test --include nif --include integration

  cnode:
    name: C-Node Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: cnode-${{ runner.os }}-${{ hashFiles('**/mix.lock', 'c_src/**') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Install Maude
        run: test -x priv/maude/bin/maude-linux-x64 || mix maude.install

      - name: Build C-Node bridge
        run: make -C c_src

      - name: Run C-Node integration tests
        run: mix test.cnode

  native-quality:
    name: Native Quality and Security
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path native/ex_maude_nif/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path native/ex_maude_nif/Cargo.toml --lib -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path native/ex_maude_nif/Cargo.toml

      - name: Rust security audit
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo audit --file native/ex_maude_nif/Cargo.lock

      - name: C format and static analysis
        run: |
          make -C c_src format-check
          make -C c_src lint
          make -C c_src
          make -C c_src test
