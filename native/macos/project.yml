name: WotexHome
options:
  bundleIdPrefix: org.wotex
  deploymentTarget:
    macOS: "13.0"
targets:
  WotexHome:
    type: application
    platform: macOS
    sources:
      - Sources/WotexHomeApp.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WoTEx Home
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wotex.home
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
