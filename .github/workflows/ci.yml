name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MIX_ENV: test
      WOTEX_HOME_GIT_DEPS: "1"
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "28.5.0.6"
          version-type: strict
      - name: Root filesystem fixture tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip tzdata
      - name: Protect installed timezone fixture data
        # The hosted image makes /usr/share world-writable. Keep the same
        # protected timezone custody required by the actual calendar reader.
        run: |
          sudo find /usr/share/zoneinfo -type d -exec chmod 0755 {} +
          sudo find /usr/share/zoneinfo -type f -exec chmod 0644 {} +
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - name: Check exact source revisions
        shell: bash
        run: |
          test "$(git -C deps/ex_maude rev-parse HEAD)" = dc41e3331c025ce77ddcaf87883425c997d69af8
          test "$(git -C deps/wotex_udp rev-parse HEAD)" = dde1837f03f88a847ba5a0ec4479711a5ff1cf96
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix woh.spec.check
      - run: mix woh.lifx.registry.fetch
      - run: mix test

  macos_app:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MIX_ENV: test
      WOTEX_HOME_GIT_DEPS: "1"
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "28.5.0.6"
          version-type: strict
      - run: mix deps.get --check-locked
      - run: mix woh.lifx.registry.fetch
      - run: mix test test/macos_app_inventory_test.exs test/macos_app_spdx_test.exs test/macos_native_deps_check_test.exs
      - run: mix woh.native.health.smoke
      - run: mix woh.native.controller.pairing.wire.smoke
      - run: mix woh.native.controller.tls.smoke
      - run: mix woh.native.rule.smoke
      - run: mix woh.native.schedule.wire.smoke
      - run: mix woh.native.schedule.client.smoke
      - run: mix woh.native.pending.codec.smoke
      - run: mix woh.native.pending.storage.smoke
      - run: mix woh.native.schedule.recovery.smoke
      - run: mix woh.native.schedule.panel.smoke
      - run: mix woh.native.quick.bar.smoke
      - run: mix woh.native.maintenance.smoke
      - run: mix woh.native.profiles.smoke
      - run: mix woh.native.profiles.panel.smoke
      - run: mix woh.native.cli.parity.smoke

  nerves_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native/nerves
    env:
      MIX_ENV: test
      MIX_TARGET: host
      WOTEX_HOME_GIT_DEPS: "1"
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "28.5.0.6"
          version-type: strict
      - name: Native host dependency
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev
      - run: mix archive.install hex nerves_bootstrap 1.17.2 --force
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --no-start
