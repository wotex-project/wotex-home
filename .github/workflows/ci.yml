name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MIX_ENV: test
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "28.5.0.6"
          version-type: strict
      - name: Root filesystem fixture tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip tzdata
      - name: Protect installed timezone fixture data
        # The hosted image makes /usr/share world-writable. Keep the same
        # protected timezone custody required by the actual calendar reader.
        run: |
          sudo find /usr/share/zoneinfo -type d -exec chmod 0755 {} +
          sudo find /usr/share/zoneinfo -type f -exec chmod 0644 {} +
      - run: mix deps.get --check-locked
      - name: Stage exact Maude payload for provenance checks
        run: |
          mkdir -p _build/maude-assets
          curl --fail --location --silent --show-error --max-filesize 8000000 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-macos-arm64.zip \
            -o _build/maude-assets/Maude-3.5.1-macos-arm64.zip
          mix woh.maude.payload.stage _build/maude-assets/Maude-3.5.1-macos-arm64.zip
      - name: Install standalone Linux interpreter for integration checks
        run: |
          mix maude.install --version 3.5.1 --path "$RUNNER_TEMP/maude-native"
          echo "MAUDE_PATH=$RUNNER_TEMP/maude-native/maude" >> "$GITHUB_ENV"
      - run: mix hex.audit
      - name: Check exact UDP source revision
        shell: bash
        run: |
          test "$(git -C deps/wotex_udp rev-parse HEAD)" = dde1837f03f88a847ba5a0ec4479711a5ff1cf96
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix woh.spec.check
      - run: mix woh.lifx.registry.fetch
      - run: mix test

  macos_app:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MIX_ENV: test
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "28.5.0.6"
          version-type: strict
      - run: mix deps.get --check-locked
      - name: Stage exact Maude payload for provenance checks
        run: |
          mkdir -p _build/maude-assets
          curl --fail --location --silent --show-error --max-filesize 8000000 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-macos-arm64.zip \
            -o _build/maude-assets/Maude-3.5.1-macos-arm64.zip
          mix woh.maude.payload.stage _build/maude-assets/Maude-3.5.1-macos-arm64.zip
      - run: mix woh.lifx.registry.fetch
      - run: mix test test/macos_app_inventory_test.exs test/macos_app_spdx_test.exs test/macos_native_deps_check_test.exs
      - run: mix woh.native.health.smoke
      - run: mix woh.native.controller.scope.smoke
      - run: mix woh.native.controller.pairing.wire.smoke
      - run: mix woh.native.controller.associations.smoke
      - run: mix woh.native.paired.keychain.policy.smoke
      - run: mix woh.native.paired.session.smoke
      - name: Repeat the complete paired recovery cohort with bounded diagnostics
        run: |
          for attempt in 1 2 3; do
            printf 'Complete paired recovery cohort %s\n' "$attempt"
            mix woh.native.paired.recovery.smoke
          done

  nerves_host:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native/nerves
    env:
      MIX_ENV: test
      MIX_TARGET: host
      EX_MAUDE_BUILD_CNODE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.6-otp-28"
          otp-version: "29.0.4"
          version-type: strict
      - name: Native host dependency
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev
      - run: mix archive.install hex nerves_bootstrap 1.17.3 --force
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --no-start
